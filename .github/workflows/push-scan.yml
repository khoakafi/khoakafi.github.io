name: Quét giá & đẩy thông báo

on:
  schedule:
    # Giờ UTC. Phiên VN (UTC+7): sáng 9:00-11:30 -> UTC 2:00-4:30
    #                            chiều 13:00-14:50 -> UTC 6:00-7:50
    - cron: '*/5 2-4 * * 1-5'
    - cron: '*/5 6-7 * * 1-5'
    # Tổng kết cuối phiên: 14h50 giờ VN = 07:50 UTC
    - cron: '50 7 * * 1-5'
  # Đẩy commit chạm vào bộ quét -> chạy thử ngay (luôn ở chế độ thử, không gửi thật)
  push:
    paths:
      - 'scripts/push-scan.js'
      - '.github/workflows/push-scan.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Chỉ chạy thử, không gửi thông báo thật'
        type: boolean
        default: true
      force:
        description: 'Bỏ qua kiểm tra giờ phiên'
        type: boolean
        default: true

concurrency:
  group: push-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Lấy code (nhánh main)
        uses: actions/checkout@v4

      - name: Lấy trạng thái chống trùng (nhánh push-state)
        run: |
          git fetch origin push-state --depth=1 2>/dev/null || true
          if git show origin/push-state:.push-state.json > .push-state.json 2>/dev/null; then
            echo "Đã tải trạng thái phiên trước"
          else
            echo '{}' > .push-state.json
            echo "Chưa có trạng thái — tạo mới"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cài web-push
        run: npm install web-push@3 --no-save --no-audit --no-fund

      - name: Quét và đẩy thông báo
        env:
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PUSH_SUBS: ${{ secrets.PUSH_SUBS }}
          SHEET_API: ${{ secrets.SHEET_API }}
          SHEET_TOKEN: ${{ secrets.SHEET_TOKEN }}
          SUMMARY: ${{ github.event.schedule == '50 7 * * 1-5' && '1' || '0' }}
          ALERT_KINDS: ${{ vars.ALERT_KINDS || 'signal,near,move' }}
          TEST_PUSH: ${{ contains(github.event.head_commit.message, '[test-push]') && '1' || '0' }}
          DRY_RUN: ${{ (github.event_name == 'push' && !contains(github.event.head_commit.message, '[test-push]') || inputs.dry_run == true) && '1' || '0' }}
          FORCE_RUN: ${{ (github.event_name == 'push' || inputs.force == true) && '1' || '0' }}
        run: node scripts/push-scan.js

      - name: Lưu lại trạng thái + nhật ký chẩn đoán
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f .push-state.json ] || echo '{}' > .push-state.json
          [ -f .push-run.json ] || echo '{}' > .push-run.json
          rm -rf /tmp/state && mkdir -p /tmp/state
          cp .push-state.json .push-run.json /tmp/state/
          cd /tmp/state
          git init -q
          git config user.name  "kn-push-bot"
          git config user.email "noreply@khoanguyeninvest.vn"
          git add .push-state.json .push-run.json
          git commit -q -m "trạng thái thông báo $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:push-state
