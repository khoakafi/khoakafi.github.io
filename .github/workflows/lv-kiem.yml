name: lv-kiem
on: workflow_dispatch
jobs:
  do:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - run: npm i --no-save playwright@1.47.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
    - run: node scripts/lv-kiem.mjs
