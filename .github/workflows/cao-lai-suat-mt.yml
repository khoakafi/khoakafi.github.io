name: cao-lai-suat-mt
# NHNN chan ~5 luot/IP -> moi runner (IP rieng) tai 1 thang, cuoi cung gop vao nhanh lai-suat.
on:
  workflow_dispatch:
    inputs:
      thang:
        description: Danh sach thang YYYY-MM cach nhau dau phay
        required: true
        type: string
permissions:
  contents: write
jobs:
  chia:
    runs-on: ubuntu-latest
    outputs:
      ds: ${{ steps.c.outputs.ds }}
    steps:
    - id: c
      env:
        T: ${{ inputs.thang }}
      run: echo "ds=$(echo "$T" | tr ', ' '\n\n' | grep -E '^[0-9]{4}-[0-9]{2}$' | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
  cao:
    needs: chia
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        thang: ${{ fromJSON(needs.chia.outputs.ds) }}
    steps:
    - uses: actions/checkout@v4
    - run: sudo apt-get install -y -qq poppler-utils >/dev/null
    - env:
        THANG: ${{ matrix.thang }}
        DELAY: "5000"
      run: OUT=/tmp/out node scripts/cao-lai-suat.mjs || true
    - uses: actions/upload-artifact@v4
      with:
        name: ls-${{ matrix.thang }}
        path: /tmp/out
        if-no-files-found: ignore
  gop:
    needs: cao
    if: always()
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: /tmp/art
        pattern: ls-*
        merge-multiple: true
    - env:
        GH_TOKEN: ${{ github.token }}
      run: |-
        git clone -q --depth 1 -b lai-suat "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/br || { mkdir -p /tmp/br; cd /tmp/br; git init -q -b lai-suat; }
        mkdir -p /tmp/br/sbv && cp -r /tmp/art/sbv/. /tmp/br/sbv/ 2>/dev/null
        cd /tmp/br && cat sbv/log-*.txt 2>/dev/null | grep -E '^[0-9]{4}-[0-9]{2} ' | sort -u > sbv/tong.txt; cat sbv/tong.txt
        git config user.name github-actions; git config user.email actions@github.com
        git add -A && git commit -qm "gop lai suat $(date -u +%FT%TZ)" && git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:lai-suat
