name: do-trang
on:
  workflow_dispatch:
    inputs:
      url:
        description: URL can mo bang Chromium
        required: true
        type: string
      eval:
        description: JS chay trong trang (than ham async, return gia tri)
        required: false
        default: ''
        type: string
      cho:
        description: Cho bao nhieu ms sau khi mo
        default: '6000'
        type: string
      chars:
        default: '4000'
        type: string
      trinh:
        description: chromium | webkit (iPhone 13)
        default: chromium
        type: string
      feval:
        description: JS chay trong tung iframe
        default: ''
        type: string
      vw:
        description: Be rong cua so (px)
        default: '1280'
        type: string
jobs:
  do:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - run: npm i --no-save playwright@1.55.0 >/dev/null 2>&1 && npx playwright install --with-deps chromium webkit >/dev/null 2>&1
    - run: node scripts/do-trang.mjs
      env:
        URL_: ${{ inputs.url }}
        EVAL: ${{ inputs.eval }}
        CHO: ${{ inputs.cho }}
        CHARS: ${{ inputs.chars }}
        VW: ${{ inputs.vw }}
        TRINH: ${{ inputs.trinh }}
        FEVAL: ${{ inputs.feval }}
